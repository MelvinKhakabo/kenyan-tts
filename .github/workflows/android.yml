# Builds the Android engine on GitHub's servers and publishes the APK.
# Every push to main produces a fresh install link:
#   https://github.com/MelvinKhakabo/kenyan-tts/releases/download/latest/kenyan-tts.apk
name: Build APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The project's Gradle daemon is set to Java 25 (android/gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Copy the lexicon into the app
        run: node scripts/sync-android.js

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk kenyan-tts.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kenyan-tts-apk
          path: kenyan-tts.apk

      - name: Publish the install link (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest kenyan-tts.apk --prerelease --target "${{ github.sha }}" \
            --title "Kenyan TTS - latest build" \
            --notes "Built automatically from ${{ github.sha }}. Install link: https://github.com/${{ github.repository }}/releases/download/latest/kenyan-tts.apk"
